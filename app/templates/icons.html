{% macro icon(name, class_name="portal-icon") -%}

     aria-hidden="true" focusable="false">

  <path d="m2 9 10-5 10 5-10 5L2 9Z" fill="currentColor" stroke="none"/>
  <path d="M6 11v4.5c3.5 2.5 8.5 2.5 12 0V11l-6 3-6-3Z" fill="currentColor" stroke="none"/>
  <path d="M22 9v6"/>
  {% elif name == "logout" %}
  <path d="M10 17l5-5-5-5"/>
  <path d="M15 12H3"/>
  <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/>
  {% elif name == "menu" %}
  <path d="M4 6h16M4 12h16M4 18h16"/>
  {% elif name == "check" %}
  <circle cx="12" cy="12" r="9"/>
  <path d="m8 12 2.5 2.5L16 9"/>
  {% elif name == "schedule" %}
  <circle cx="12" cy="12" r="9"/>
  <path d="M12 7v5l3.5 2"/>

  <path d="m8.5 12 2.2 2.2 4.8-4.8"/>

  <circle cx="10" cy="8" r="3.2"/>
  <path d="M3.5 19a6.5 6.5 0 0 1 10.3-5.2"/>
  <circle cx="17" cy="17" r="3.2"/>
  <path d="m19.4 19.4 2.1 2.1"/>
  {% endif %}
</svg>
{%- endmacro %}
